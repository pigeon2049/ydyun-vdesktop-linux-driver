# Use with the optional ydyun-usbctl-backward.service.
# The service exposes a local standard USB/IP endpoint on 127.0.0.1:3247.
# compression = off keeps the bridge byte-transparent.  Set lz4 only after a
# real cloud session confirms the official 9-byte type/length/LZ4 wrapper.
[connection]
remote_host = 127.0.0.1
remote_port = 3247
reconnect_seconds = 5
command_timeout = 30
detach_on_exit = yes

[devices]
# Add only the bus IDs confirmed by the cloud session.
# 1-2 = USB storage
# 1-3 = keyboard
# 1-4 = mouse

[backward]
# The unit is disabled by default.  If explicitly enabled, keep the vendor
# control listener and local USB/IP proxy on loopback unless the authorized
# session architecture requires another bind address.
enabled = yes
listen_host = 127.0.0.1
listen_port = 3246
proxy_host = 127.0.0.1
proxy_port = 3247
frame_timeout = 10
max_pending = 16
allowed_ops = 1,2
auto_attach = no
attach_timeout = 30
compression = off
