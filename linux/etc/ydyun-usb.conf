# YDYUN Linux USB/IP guest controller
#
# remote_port=3240 is the mainline USB/IP default.  The Windows payload also
# exposes 3246 as a ZTE USB/IP candidate and 5100/19000 as other NAT/discovery
# paths.  For a ZTE cloud session, set this explicitly to the port supplied by
# the session (often 3246); do not use 5100/19000 as a USB data port blindly.

[connection]
remote_host = 127.0.0.1
remote_port = 3240
reconnect_seconds = 5
command_timeout = 30
detach_on_exit = yes

# Add only the remote bus IDs that the cloud policy allows.
#
# [devices]
# 1-2 = USB storage
# 1-3 = keyboard
# 1-4 = mouse

[devices]

# Optional local-device export.  Nothing is bound unless a bus ID is listed
# here and the export command/service is explicitly started.
# [local_devices]
# 3-9 = local mouse
# 3-10 = local keyboard

# Optional ZTE backward-link bridge.  It is deliberately disabled by default.
# When enabled, cloud connections to listen_port must first send the proven
# 0x0202/0x210-byte control prefix with USB op_cmd 1 or 2.  The bridge then
# exposes the same TCP stream on proxy_host:proxy_port for native usbip attach.
# Do not enable this until the cloud session is known to use this path.
[backward]
enabled = no
listen_host = 0.0.0.0
listen_port = 3246
proxy_host = 127.0.0.1
proxy_port = 3247
frame_timeout = 10
attach_timeout = 30
max_pending = 16
allowed_ops = 1,2
# When explicitly enabled, op 1 triggers native usbip attach using the
# validated +0x190 bus ID and op 2 detaches matching local VHCI ports.
# Keep this off until a real cloud session confirms the control/data timing.
auto_attach = no
# Optional official-library USB payload wrapper translation.  Keep off until
# a real session confirms the 9-byte type/length/LZ4 framing on this link.
compression = off
